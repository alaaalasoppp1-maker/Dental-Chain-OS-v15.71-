<body class="dcos-auth-pending">

<main class="app-shell">

<header class="brand-topbar">
<button type="button" class="brand-mark brand-home-btn" onclick="backToHome()" title="رجوع للرئيسية">Dr.</button>
<div>
<h2>نظام إدارة عيادات د. طاهر</h2>
<p>DDS, PhD-Endodontics</p>
</div>

</header>

<div class="patient-inputs">

<div class="fields-box">
<input id="name" placeholder="اسم المريض">
<input id="age" type="number" placeholder="العمر">
<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9+ ]*" placeholder="رقم الهاتف">
<textarea id="allergy" placeholder="التحسس الدوائي"></textarea>
<textarea id="chronic" placeholder="الأمراض المزمنة"></textarea>
<textarea id="notes" placeholder="الملاحظات"></textarea>
<div id="dcosPatientGenderField" class="dcos-patient-gender-field">
<span class="dcos-gender-label">الجنس</span>
<div class="dcos-gender-options" role="group" aria-label="جنس المريض">
<label><input type="radio" name="dcosPatientGender" value="male" data-dcos-gender><span>ذكر</span></label>
<label><input type="radio" name="dcosPatientGender" value="female" data-dcos-gender><span>أنثى</span></label>
</div>
</div>
<input id="fileNo" class="file-no-input" placeholder="رقم الملف" readonly>
</div>

<button type="button" class="clear-fields-btn" onclick="clearPatientFields()" title="تفريغ الخانات">
🗑
</button>

</div>

<br>

<div class="doctor-bar workflow-star-card">
<div class="doctor-select-wrap">
<label>الطبيب المعالج</label>
<select id="activeDoctor">
<option value="د. علاء">د. علاء</option>
<option value="د. ديما">د. ديما</option>
<option value="المساعدة">المساعدة</option>
</select>
</div>
<div class="primary-patient-actions">
<button onclick="registerPatient()">➕ تسجيل مريض</button>
<button onclick="openVisit()">📝 تسجيل زيارة</button>
<button onclick="openPrescription()">🧾 إنشاء وصفة</button>
</div>
</div>

<div class="main-actions">

<input id="backupInput" type="file" accept="application/json" style="display:none" onchange="importBackup(event)">
</div>

<div id="searchBox" style="display:none; margin-top:20px;">
<input id="searchInput" placeholder="ابحث بالاسم أو الهاتف أو رقم الملف..." oninput="searchPatients()">
<div id="suggestionsBox" class="suggestions-box"></div>
<button id="createNewBtn" style="display:none;" onclick="createNewPatientFromSearch()">
➕ إنشاء مريض جديد
</button>
</div>

<div id="visitModal" class="modal hidden">
<div class="modalBox">
<h3>تسجيل زيارة</h3>
<textarea id="visitText" placeholder="ملاحظات الزيارة"></textarea>
<div class="visit-payment-box">
<label>دفعة مالية مع الزيارة</label>
<div class="visit-payment-line">
<input id="visitPaymentAmount" type="number" placeholder="المبلغ المدفوع">
<select id="visitPaymentCurrency">
<option value="SYP">ل.س</option>
<option value="USD">$</option>
</select>
</div>
<input id="visitPaymentNote" placeholder="ملاحظة الدفعة - اختياري">
</div>
<button onclick="saveVisit()">حفظ</button>
<button onclick="closeVisit()">رجوع</button>
</div>
</div>

<div id="output"></div>

<button id="backBtn" onclick="backToHome()" style="display:none;">
رجوع للرئيسية
</button>
